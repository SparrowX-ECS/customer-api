environment:
  name: sparrowx

service:
  name: customer-api
  stack: sparrowx-customer-api

image:
  repository: customer-api

container:
  port: 8000
  cpu: 256
  memory: 512

deployment:
  desiredCount: 1

loadBalancer:
  pathPattern: /api/customer/*
  listenerRulePriority: 100
  healthCheckPath: /health

database:
  enabled: true
  stack: sparrowx-database
  endpoint: ''
  port: 5432
  name: customerdb
  outputs:
    endpoint: CustomerDatabaseEndpoint
    port: CustomerDatabasePort
    secret_arn: CustomerDatabaseSecretArn
    security_group_id: CustomerDatabaseSecurityGroupId
