project:
  name: sparrowx
  environment: dev

service:
  nameSpace: sparrowx/dev
  name: customer-api

image:
  repository: customerapi

container:
  port: 8000
  size: micro

deployment:
  desiredCount: 1

loadBalancer:
  pathPattern: /api/customer/*
  listenerRulePriority: 100
  healthCheckPath: /health

database:
  enabled: true
  endpoint: ''
  port: 5432
  name: customerdb