name: Manual Re-Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REDEPLOY to confirm ECS Task Redeployment
        required: true
        type: string


permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
    
jobs:
  redeploy:
    name: Re-Deploy
    uses: SparrowX-ECS/workflows-templates/.github/workflows/deploy.yaml@v3.2.1
    with:
      database-enabled: true
      update-image: false